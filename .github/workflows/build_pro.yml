name: Build TG Pro DMG

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/build_pro.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
  workflow_dispatch:

jobs:
  build:
    name: macOS DMG
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      GIT: "https://github.com"
      CMAKE_GENERATOR: "Ninja"
      CMAKE_BUILD_PARALLEL_LEVEL: ""
      CMAKE_PREFIX_PATH: "/opt/homebrew/opt/ffmpeg@6:/opt/homebrew/opt/openal-soft"
      TDE2E: "51743dfd01dff6179e2d8f7095729caa4e2222e9"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          brew update
          brew upgrade || true
          brew install ada-url autoconf automake boost cmake ffmpeg@6 jpeg-xl libavif libheif libtool openal-soft openh264 openssl opus ninja pkg-config python qtbase qtimageformats qtshadertools qtsvg xz ccache || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

          echo "MACOSX_DEPLOYMENT_TARGET=$(grep 'set(QT_SUPPORTED_MIN_MACOS_VERSION' /opt/homebrew/Cellar/qtbase/*/lib/cmake/Qt6/Qt6ConfigExtras.cmake | sed -E 's/^.*"(.*)"\)$/\1/')" >> $GITHUB_ENV
          echo "LibrariesPath=`pwd`" >> $GITHUB_ENV

          echo "RNNOISE=`curl -sSL --header 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' https://api.github.com/repos/xiph/rnnoise/git/refs/heads/master | jq -r .object.sha`" >> $GITHUB_ENV
          echo "WEBRTC=`curl -sSL --header 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' https://api.github.com/repos/desktop-app/tg_owt/git/refs/heads/master | jq -r .object.sha`" >> $GITHUB_ENV

      - name: RNNoise cache.
        id: cache-rnnoise
        uses: actions/cache@v5
        with:
          path: ${{ env.LibrariesPath }}/local/rnnoise
          key: ${{ runner.OS }}-rnnoise-${{ env.RNNOISE }}
          restore-keys: |
            ${{ runner.OS }}-rnnoise-

      - name: RNNoise.
        if: steps.cache-rnnoise.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath
          git clone --depth=1 $GIT/xiph/rnnoise.git
          cd rnnoise
          ./autogen.sh
          ./configure --prefix=$LibrariesPath/local/rnnoise --disable-examples --disable-doc
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: WebRTC cache.
        id: cache-webrtc
        uses: actions/cache@v5
        with:
          path: ${{ env.LibrariesPath }}/local/tg_owt
          key: ${{ runner.OS }}-webrtc-${{ env.WEBRTC }}
          restore-keys: |
            ${{ runner.OS }}-webrtc-

      - name: WebRTC.
        if: steps.cache-webrtc.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath
          git clone --depth=1 --recursive --shallow-submodules $GIT/desktop-app/tg_owt.git
          cd tg_owt
          cmake -Bbuild . -DCMAKE_INSTALL_PREFIX=$LibrariesPath/local/tg_owt
          cmake --build build
          cmake --install build

      - name: TDE2E cache.
        id: cache-tde2e
        uses: actions/cache@v5
        with:
          path: ${{ env.LibrariesPath }}/local/tde2e
          key: ${{ runner.OS }}-tde2e-${{ env.TDE2E }}
          restore-keys: |
            ${{ runner.OS }}-tde2e-

      - name: TDE2E.
        if: steps.cache-tde2e.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath
          git init tde2e
          cd tde2e
          git remote add origin $GIT/tdlib/td.git
          git fetch --depth=1 origin $TDE2E
          git reset --hard FETCH_HEAD
          cmake -Bbuild . -DCMAKE_INSTALL_PREFIX=$LibrariesPath/local/tde2e -DTD_E2E_ONLY=ON
          cmake --build build
          cmake --install build

      - name: ccache cache.
        id: cache-ccache
        uses: actions/cache@v5
        with:
          path: /Users/runner/ccache.tar
          key: ${{ runner.OS }}-ccache-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.OS }}-ccache-

      - name: Restore ccache.
        run: |
          if [ -f /Users/runner/ccache.tar ]; then
            rm -rf /Users/runner/ccache
            mkdir -p /Users/runner/ccache
            tar -xf /Users/runner/ccache.tar -C /Users/runner/ccache
            echo "ccache restored"
          else
            mkdir -p /Users/runner/ccache
            echo "no ccache, fresh start"
          fi

      - name: Build cache.
        id: cache-build
        uses: actions/cache@v5
        with:
          path: /Users/runner/build.tar.gz
          key: ${{ runner.OS }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.OS }}-build-${{ github.ref_name }}-
            ${{ runner.OS }}-build-

      - name: Restore build.
        run: |
          if [ -f /Users/runner/build.tar.gz ]; then
            rm -rf $REPO_NAME/build
            mkdir -p $REPO_NAME/build
            tar -xzf /Users/runner/build.tar.gz -C $REPO_NAME/build
            echo "build dir restored"
            echo "BUILD_RESTORED=true" >> $GITHUB_ENV
          else
            echo "BUILD_RESTORED=false" >> $GITHUB_ENV
          fi

      - name: Configure ccache.
        run: |
          export CCACHE_DIR=/Users/runner/ccache
          ccache --max-size=10G
          ccache --zero-stats
          ccache --set-config=sloppiness=include_file_mtime,include_file_ctime,time_macros,pch_defines,file_stat_matches
          ccache --set-config=compiler_check=content

      - name: Telegram Desktop build.
        env:
          CCACHE_DIR: /Users/runner/ccache
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines,file_stat_matches
          CCACHE_COMPILERCHECK: content
        run: |
          cd $REPO_NAME
          export CMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH$(find $LibrariesPath/local -mindepth 1 -maxdepth 1 -type d -exec printf ':%s' {} +)"
          export PATH="/usr/libexec/ccache:/opt/homebrew/opt/ccache/libexec:$PATH"

          if [ "$BUILD_RESTORED" = "true" ] && [ -f build/build.ninja ]; then
            echo "Build dir restored, running incremental build..."
            cmake --build build
          else
            echo "Fresh build..."
            cmake -Bbuild . \
              -D CMAKE_C_COMPILER_LAUNCHER=ccache \
              -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -D CMAKE_C_FLAGS_INIT=-g0 \
              -D CMAKE_CXX_FLAGS_INIT=-g0 \
              -D TDESKTOP_API_ID=14565251 \
              -D TDESKTOP_API_HASH=9952ccf3124c8fa7835d9b8e091dfb4a \
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
              -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
            cmake --build build
          fi

          ccache --show-stats

      - name: Save ccache.
        run: |
          tar -cf /Users/runner/ccache.tar -C /Users/runner/ccache .
          echo "ccache saved ($(du -sh /Users/runner/ccache.tar | cut -f1))"

      - name: Save build.
        run: |
          tar -czf /Users/runner/build.tar.gz -C $REPO_NAME/build .
          echo "build dir saved ($(du -sh /Users/runner/build.tar.gz | cut -f1))"

      - name: Package app.
        run: |
          cd $REPO_NAME/build
          macdeployqt TGPro.app -verbose=1
          codesign -s - -f --deep TGPro.app || true

      - name: Create DMG.
        run: |
          cd $REPO_NAME/build
          mkdir -p dmg
          cp -R TGPro.app dmg/
          hdiutil create -volname "TG Pro" -srcfolder dmg -ov -format UDZO "TGPro.dmg"

      - name: Publish Release.
        run: |
          cd $REPO_NAME
          gh release delete nightly --yes --cleanup-tag || true
          git tag -f nightly
          git push -f origin nightly
          gh release create nightly build/TGPro.dmg \
            --title "TG Pro Nightly Build" \
            --notes "Automated build from commit ${{ github.sha }}." \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG artifact.
        uses: actions/upload-artifact@v7
        with:
          name: TGPro-${{ github.sha }}
          path: ${{ env.REPO_NAME }}/build/TGPro.dmg

      - name: Upload .app artifact.
        uses: actions/upload-artifact@v7
        with:
          name: TGPro-app-${{ github.sha }}
          path: ${{ env.REPO_NAME }}/build/TGPro.app
